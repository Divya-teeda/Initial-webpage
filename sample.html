<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <!-- Font Awesome for WhatsApp & Instagram icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        /* Profile Image */
        .profile-image {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ddd;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .designation {
            color: #777;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .description {
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Details section */
        .details {
            text-align: left;
            margin: 20px 0;
        }

        .detail-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .detail-item strong {
            display: inline-block;
            width: 100px;
        }

        /* Social Media */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .social-links a {
            text-decoration: none;
            font-size: 18px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            transition: 0.3s;
        }

        .whatsapp {
            background: #25D366;
        }

        .instagram {
            background: #E4405F;
        }

        .social-links a:hover {
            transform: translateY(-3px);
            opacity: 0.85;
        }

        .social-links i {
            margin-right: 8px;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 25px 20px;
            }

            .social-links {
                flex-direction: column;
                gap: 12px;
            }

            .social-links a {
                display: block;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Profile Image -->
       <img
    src="profile.png"
    alt="Profile Photo"
    class="profile-image"
>

        <!-- Name -->
        <h1>Akshaya</h1>

        <!-- Designation -->
        <p class="designation">Business Owner | Entrepreneur</p>

        <!-- Description -->
        <p class="description">
            Welcome to my profile page.
            Here you can find my basic information,
            business details and social media links.
        </p>

        <!-- Details -->
        <div class="details">

            <div class="detail-item">
                <strong>Phone:</strong>
                +91 98765 43210
            </div>

            <div class="detail-item">
                <strong>Email:</strong>
                johndoe@example.com
            </div>

            <div class="detail-item">
                <strong>Location:</strong>
                Hyderabad, India
            </div>

            <div class="detail-item">
                <strong>Website:</strong>
                www.example.com
            </div>

        </div>

        <!-- Social Media Links -->
        <div class="social-links">

            <!-- WhatsApp -->
            <a
                href="https://wa.me/919346863630"
                target="_blank"
                class="whatsapp"
            >
                <i class="fa-brands fa-whatsapp"></i>
                WhatsApp
            </a>

            <!-- Instagram -->
            <a
                href="https://www.instagram.com/shiva_kumar0330"
                target="_blank"
                class="instagram"
            >
                <i class="fa-brands fa-instagram"></i>
                Instagram
            </a>

        </div>

    </div>

</body>
</html>
